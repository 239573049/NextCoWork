<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      默认写死生产用的严格 CSP。dev 模式下由 electron.vite.config.ts 里的 cspPlugin
      整段替换成放宽版(react-refresh 的内联 preamble + HMR websocket 需要)。
      顺序是刻意的:插件没生效时留下的是严格版,失败方向朝安全那边倒。

      ★ `ncw:` 是附件协议(src/main/net/attachment-protocol.ts)。**两处 CSP 都要有它** ——
      这里是生产版,dev 版在 electron.vite.config.ts 的 DEV_CSP 里。只改一处的话
      开发时正常、打包后图片全不显示,而且不报错,只留一行 CSP 警告。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ncw: https: http:; media-src 'self' ncw:; font-src 'self' data:; connect-src 'self' ncw:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>NextCoWork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
