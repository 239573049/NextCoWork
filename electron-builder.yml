appId: com.nextcowork.app
productName: NextCoWork
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/skills/**/*'
  - '!.next-cowork'
  - '!docs/*'
  - '!test/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierrc,.prettierignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
extraResources:
  - from: resources/skills
    to: skills
    filter:
      - '**/*'
asarUnpack:
  - '**/node_modules/node-pty/**'
  - 'resources/**'
npmRebuild: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: false
  onlyLoadAppFromAsar: false
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
  # 必须保持 false。开启后 fuse 步骤会自己去 codesign，而那次调用不在我们控制内，
  # 碰上 iCloud 补盖的 com.apple.FinderInfo 就会以 "detritus not allowed" 整个构建失败。
  resetAdHocDarwinSignature: false
# macOS 的 fuse 翻转与 ad-hoc 签名都在这个钩子里按正确顺序完成（先翻 fuse 再签名），
# 否则 fuse 写入会让签名作废，应用启动即被内核杀掉。详见钩子文件里的说明。
afterPack: scripts/mac-adhoc-sign.mjs
publish:
  provider: generic
  url: https://nextco.work/api/client/updates/feed/stable/
win:
  target:
    - nsis
mac:
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
linux:
  target:
    - AppImage
nsis:
  oneClick: false
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
