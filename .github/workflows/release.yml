name: Build desktop releases

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            id: windows
            runner: windows-latest
            arch: x64
            artifact_path: dist/*.exe
          - name: Ubuntu
            id: linux
            runner: ubuntu-latest
            arch: x64
            artifact_path: dist/*.AppImage
          - name: macOS Apple Silicon
            id: macos-arm64
            runner: macos-15
            arch: arm64
            artifact_path: |
              dist/*-arm64.dmg
              dist/*-arm64-mac.zip
          - name: macOS Intel
            id: macos-x64
            runner: macos-15-intel
            arch: x64
            artifact_path: |
              dist/*-x64.dmg
              dist/*-x64-mac.zip

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Keep CI and packaging on a runtime that provides node:sqlite.
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run dist:ci -- --${{ matrix.arch }}
        env:
          # Unsigned Windows and macOS artifacts are intentional for this release flow.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextcowork-${{ matrix.id }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: nextcowork-*
          merge-multiple: true

      - name: Verify client artifacts before publishing
        run: node scripts/upload-client-release.mjs --dir release-assets --version "${GITHUB_REF_NAME#v}" --require-all --dry-run

      - name: Create release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release artifacts were downloaded" >&2
            exit 1
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Upload client artifacts to NextCoWork API
        env:
          CLIENT_UPLOAD_TOKEN: ${{ secrets.CLIENT_UPLOAD_TOKEN }}
          CLIENT_UPDATE_BASE_URL: https://nextco.work
        run: node scripts/upload-client-release.mjs --dir release-assets --version "${GITHUB_REF_NAME#v}" --base-url "$CLIENT_UPDATE_BASE_URL" --require-all --ignore-duplicates
